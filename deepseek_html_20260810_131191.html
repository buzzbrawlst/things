<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Windows 12 · Modern Desktop</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI Variable', 'Segoe UI', 'SF Pro Display', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #0a0a1a;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* desktop with deeper acrylic, closer to the screenshot */
    .desktop {
      width: 100%;
      height: 100%;
      max-width: 1366px;
      max-height: 768px;
      background: linear-gradient(145deg, #141428, #1e1e3a);
      position: relative;
      border-radius: 16px;
      box-shadow: 0 30px 60px -15px rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.06);
    }

    /* icon grid – more spacious, like the image */
    .icon-area {
      flex: 1;
      position: relative;
      padding: 40px 45px;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 28px 36px;
      z-index: 2;
    }

    .desktop-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 96px;
      cursor: pointer;
      color: #f0f0ff;
      text-shadow: 0 3px 8px rgba(0,0,0,0.7);
      padding: 14px 8px 12px;
      border-radius: 16px;
      transition: all 0.2s ease;
      user-select: none;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.05);
    }

    .desktop-icon:hover {
      background: rgba(255,255,255,0.14);
      border-color: rgba(255,255,255,0.25);
      transform: translateY(-3px);
      box-shadow: 0 14px 28px rgba(0,0,0,0.5);
    }

    .desktop-icon:active {
      transform: scale(0.94);
      background: rgba(255,255,255,0.2);
    }

    .desktop-icon img {
      width: 60px;
      height: 60px;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.6));
      margin-bottom: 8px;
      border-radius: 14px;
    }

    .desktop-icon span {
      font-size: 13px;
      font-weight: 500;
      background: rgba(0,0,0,0.3);
      backdrop-filter: blur(10px);
      padding: 5px 14px;
      border-radius: 30px;
      text-align: center;
      word-break: break-word;
      max-width: 90px;
      letter-spacing: 0.2px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    /* Windows 12 style taskbar – more glass, centered */
    .taskbar {
      background: rgba(12, 12, 28, 0.65);
      backdrop-filter: blur(40px) saturate(200%);
      -webkit-backdrop-filter: blur(40px) saturate(200%);
      border-top: 1px solid rgba(255,255,255,0.08);
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 22px;
      z-index: 30;
      border-radius: 0 0 16px 16px;
      box-shadow: 0 -6px 24px rgba(0,0,0,0.5);
    }

    .start-button {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 8px 22px;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      margin-right: 18px;
      color: white;
      transition: 0.2s;
      backdrop-filter: blur(10px);
      letter-spacing: 0.3px;
    }

    .start-button:hover {
      background: rgba(255,255,255,0.14);
      border-color: rgba(255,255,255,0.3);
    }

    .start-button img {
      width: 24px;
      height: 24px;
      filter: drop-shadow(0 2px 6px black);
    }

    .taskbar-windows {
      display: flex;
      gap: 12px;
      flex: 1;
      overflow-x: auto;
      height: 50px;
      align-items: center;
      padding: 0 8px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
    }

    .taskbar-windows::-webkit-scrollbar {
      height: 4px;
    }
    .taskbar-windows::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
    }

    .task-item {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 8px 22px;
      font-size: 14px;
      min-width: 150px;
      text-align: left;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #e8e8ff;
      font-weight: 500;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .task-item.active {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.4);
      box-shadow: 0 0 20px rgba(80,140,255,0.25);
      font-weight: 600;
      color: white;
    }

    .task-item:hover {
      background: rgba(255,255,255,0.14);
    }

    .clock-area {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 8px 24px;
      color: #eef0ff;
      font-size: 15px;
      font-weight: 500;
      margin-left: auto;
      backdrop-filter: blur(10px);
      letter-spacing: 0.6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.4;
      min-width: 100px;
    }

    .clock-area .date {
      font-size: 11px;
      opacity: 0.6;
      font-weight: 400;
      letter-spacing: 0.3px;
    }

    /* Modern window (acrylic / mica) – more like Windows 12 */
    .window {
      position: absolute;
      background: rgba(230, 235, 250, 0.75);
      backdrop-filter: blur(45px) saturate(220%);
      -webkit-backdrop-filter: blur(45px) saturate(220%);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 18px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.15);
      min-width: 380px;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      z-index: 15;
      resize: both;
      overflow: auto;
      color: #111;
      transition: box-shadow 0.2s;
    }

    .window:focus-within {
      box-shadow: 0 30px 55px rgba(0,0,0,0.7), 0 0 0 2px rgba(160, 190, 255, 0.5);
    }

    .window-title {
      background: rgba(255,255,255,0.3);
      backdrop-filter: blur(20px);
      color: #14142a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      font-weight: 600;
      font-size: 14px;
      cursor: move;
      user-select: none;
      border-radius: 18px 18px 0 0;
      border-bottom: 1px solid rgba(255,255,255,0.3);
    }

    .window-controls {
      display: flex;
      gap: 12px;
    }

    .win-btn {
      background: rgba(255,255,255,0.5);
      backdrop-filter: blur(8px);
      border: none;
      border-radius: 10px;
      width: 32px;
      height: 32px;
      font-weight: 600;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #1e1e3a;
      transition: 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .win-btn:hover {
      background: rgba(255,255,255,0.9);
      color: #000;
    }

    .close-btn:hover {
      background: #e81123;
      color: white;
    }

    .window-content {
      flex: 1;
      padding: 20px;
      background: rgba(255,255,255,0.35);
      backdrop-filter: blur(18px);
      margin: 10px 16px 18px 16px;
      border-radius: 14px;
      overflow: auto;
      font-size: 15px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border: 1px solid rgba(255,255,255,0.5);
      color: #0b0b20;
    }

    .hidden {
      display: none !important;
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      width: 100%;
    }

    canvas {
      border-radius: 16px;
      background: #ececf5;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.15);
      width: 100%;
      height: auto;
      max-width: 320px;
      image-rendering: auto;
    }

    button.retro {
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 40px;
      padding: 12px 34px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: 0.2s;
      color: #111;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
      letter-spacing: 0.4px;
    }

    button.retro:hover {
      background: white;
      border-color: white;
      box-shadow: 0 12px 28px rgba(0,0,0,0.25);
    }

    .score {
      font-weight: 700;
      font-size: 22px;
      background: rgba(255,255,255,0.4);
      backdrop-filter: blur(10px);
      padding: 8px 28px;
      border-radius: 40px;
      color: #0a0a20;
    }

    .instructions {
      background: rgba(255,255,240,0.6);
      backdrop-filter: blur(8px);
      border-radius: 30px;
      padding: 8px 22px;
      font-size: 13px;
      font-weight: 500;
    }

    /* extra desktop icons to match screenshot style */
    .desktop-icon.system {
      background: rgba(255,255,255,0.03);
    }

    .desktop-icon.system span {
      background: rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>
<div class="desktop" id="desktop">
  <div class="icon-area" id="iconArea">
    <!-- This PC, Setting, About Windows 12, Edge, Feedback – matching the image -->
    <div class="desktop-icon system" data-app="thispc" data-title="This PC">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%232d2d5a' rx='14'/%3E%3Crect x='12' y='18' width='40' height='28' fill='%235a7dff' rx='6'/%3E%3Crect x='16' y='22' width='32' height='20' fill='%233d5cbf' rx='4'/%3E%3Ccircle cx='32' cy='38' r='6' fill='%23b0caff'/%3E%3C/svg%3E" alt="pc">
      <span>This PC</span>
    </div>
    <div class="desktop-icon system" data-app="settings" data-title="Setting">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23282844' rx='14'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%2399bbff'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%231f2a5a'/%3E%3C/svg%3E" alt="settings">
      <span>Setting</span>
    </div>
    <div class="desktop-icon system" data-app="about" data-title="About Windows 12">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231f1f3d' rx='14'/%3E%3Ctext x='32' y='44' font-size='28' text-anchor='middle' fill='%2399ddff' font-weight='bold'%3E12%3C/text%3E%3C/svg%3E" alt="win12">
      <span>About Windows 12</span>
    </div>
    <div class="desktop-icon system" data-app="edge" data-title="Microsoft Edge">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231a2b4a' rx='14'/%3E%3Cpath d='M18 24 Q32 14 46 24 Q40 36 32 40 Q24 36 18 24' fill='%2347a3ff'/%3E%3Cpath d='M24 32 Q32 44 40 32 Q36 24 32 22 Q28 24 24 32' fill='%236bb8ff'/%3E%3C/svg%3E" alt="edge">
      <span>Microsoft Edge</span>
    </div>
    <div class="desktop-icon system" data-app="feedback" data-title="Feedback">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%232a2a4a' rx='14'/%3E%3Ccircle cx='32' cy='30' r='12' fill='%23ffcc77'/%3E%3Ctext x='32' y='36' font-size='14' text-anchor='middle' fill='%23222'%3E!%3C/text%3E%3C/svg%3E" alt="feedback">
      <span>Feedback</span>
    </div>
    <!-- Snake & Minesweeper as games -->
    <div class="desktop-icon" data-app="snake" data-title="Snake Game">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23352b5f' rx='14'/%3E%3Ccircle cx='24' cy='22' r='6' fill='%23FFD93D'/%3E%3Ccircle cx='40' cy='22' r='6' fill='%23FFD93D'/%3E%3Cpath d='M12 44 L26 28 L38 38 L50 22 L56 34' stroke='%2344dd88' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" alt="snake">
      <span>Snake.exe</span>
    </div>
    <div class="desktop-icon" data-app="minesweeper" data-title="Minesweeper">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23282840' rx='14'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%23CCCCDD'/%3E%3Cline x1='32' y1='16' x2='32' y2='48' stroke='%23FF5555' stroke-width='4' stroke-linecap='round'/%3E%3Cline x1='16' y1='32' x2='48' y2='32' stroke='%23FF5555' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" alt="mines">
      <span>Mines.exe</span>
    </div>
  </div>

  <div class="taskbar">
    <div class="start-button" id="startButton">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%234B7BFF' rx='8'/%3E%3Crect x='6' y='6' width='8' height='8' fill='white' rx='2'/%3E%3Crect x='18' y='6' width='8' height='8' fill='white' rx='2'/%3E%3Crect x='6' y='18' width='8' height='8' fill='white' rx='2'/%3E%3Crect x='18' y='18' width='8' height='8' fill='white' rx='2'/%3E%3C/svg%3E" alt="start">
      Start
    </div>
    <div class="taskbar-windows" id="taskbarWindows"></div>
    <div class="clock-area" id="clock">
      <span id="timeDisplay">12:00 PM</span>
      <span class="date" id="dateDisplay">2026/08/10</span>
    </div>
  </div>
</div>

<script>
  (function() {
    const desktop = document.getElementById('desktop');
    const taskbarWindows = document.getElementById('taskbarWindows');
    const iconArea = document.getElementById('iconArea');
    const timeDisplay = document.getElementById('timeDisplay');
    const dateDisplay = document.getElementById('dateDisplay');

    let openWindows = new Map();
    let activeWindowId = null;
    let zIndexCounter = 20;

    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2,'0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      timeDisplay.textContent = `${hours}:${minutes} ${ampm}`;
      const year = now.getFullYear();
      const month = (now.getMonth()+1).toString().padStart(2,'0');
      const day = now.getDate().toString().padStart(2,'0');
      dateDisplay.textContent = `${year}/${month}/${day}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function createWindow(appId, title, contentHTML) {
      if (openWindows.has(appId)) {
        focusWindow(appId);
        return openWindows.get(appId).windowEl;
      }

      const winDiv = document.createElement('div');
      winDiv.className = 'window';
      winDiv.setAttribute('data-app', appId);
      winDiv.style.left = '80px';
      winDiv.style.top = '60px';
      winDiv.style.zIndex = ++zIndexCounter;
      
      const titleBar = document.createElement('div');
      titleBar.className = 'window-title';
      titleBar.innerHTML = `<span>${title}</span>
        <div class="window-controls">
          <div class="win-btn minimize-btn">─</div>
          <div class="win-btn close-btn">✕</div>
        </div>`;
      
      const contentDiv = document.createElement('div');
      contentDiv.className = 'window-content';
      contentDiv.innerHTML = contentHTML;

      winDiv.appendChild(titleBar);
      winDiv.appendChild(contentDiv);
      desktop.appendChild(winDiv);

      const taskItem = document.createElement('div');
      taskItem.className = 'task-item';
      taskItem.textContent = title;
      taskItem.setAttribute('data-app', appId);
      taskbarWindows.appendChild(taskItem);

      openWindows.set(appId, {
        windowEl: winDiv,
        taskItem: taskItem,
        title: title,
        appId: appId
      });

      winDiv.addEventListener('mousedown', (e) => {
        focusWindow(appId);
      });

      taskItem.addEventListener('click', () => {
        const winData = openWindows.get(appId);
        if (!winData) return;
        if (activeWindowId === appId && winData.windowEl.style.display !== 'none') {
          minimizeWindow(appId);
        } else {
          focusWindow(appId);
          if (winData.windowEl.style.display === 'none') {
            winData.windowEl.style.display = 'flex';
          }
        }
      });

      const closeBtn = titleBar.querySelector('.close-btn');
      closeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        closeWindow(appId);
      });

      const minimizeBtn = titleBar.querySelector('.minimize-btn');
      minimizeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        minimizeWindow(appId);
      });

      titleBar.addEventListener('mousedown', (e) => {
        if (e.target.classList.contains('win-btn')) return;
        focusWindow(appId);
        const win = winDiv;
        const shiftX = e.clientX - win.getBoundingClientRect().left;
        const shiftY = e.clientY - win.getBoundingClientRect().top;

        function onMouseMove(e) {
          let newLeft = e.clientX - shiftX;
          let newTop = e.clientY - shiftY;
          const deskRect = desktop.getBoundingClientRect();
          if (newLeft < 0) newLeft = 0;
          if (newTop < 0) newTop = 0;
          if (newLeft + win.offsetWidth > deskRect.width) newLeft = deskRect.width - win.offsetWidth;
          if (newTop + win.offsetHeight > deskRect.height - 70) newTop = deskRect.height - win.offsetHeight - 70;
          win.style.left = newLeft + 'px';
          win.style.top = newTop + 'px';
        }

        function onMouseUp() {
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);
        }
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });

      focusWindow(appId);
      return winDiv;
    }

    function focusWindow(appId) {
      const data = openWindows.get(appId);
      if (!data) return;
      data.windowEl.style.zIndex = ++zIndexCounter;
      if (activeWindowId && openWindows.has(activeWindowId)) {
        openWindows.get(activeWindowId).taskItem.classList.remove('active');
      }
      activeWindowId = appId;
      data.taskItem.classList.add('active');
      data.windowEl.style.display = 'flex';
    }

    function minimizeWindow(appId) {
      const data = openWindows.get(appId);
      if (!data) return;
      data.windowEl.style.display = 'none';
      data.taskItem.classList.remove('active');
      if (activeWindowId === appId) activeWindowId = null;
    }

    function closeWindow(appId) {
      const data = openWindows.get(appId);
      if (!data) return;
      data.windowEl.remove();
      data.taskItem.remove();
      openWindows.delete(appId);
      if (activeWindowId === appId) activeWindowId = null;
      if (appId === 'snake' && window.snakeInterval) {
        clearInterval(window.snakeInterval);
        window.snakeInterval = null;
      }
    }

    iconArea.addEventListener('dblclick', (e) => {
      const icon = e.target.closest('.desktop-icon');
      if (!icon) return;
      const app = icon.getAttribute('data-app');
      const title = icon.getAttribute('data-title') || app;
      if (app === 'snake') openSnakeGame(app, title);
      else if (app === 'minesweeper') openMinesweeper(app, title);
      else if (app === 'thispc' || app === 'settings' || app === 'about' || app === 'edge' || app === 'feedback') {
        createWindow(app, title, `<div style="padding:20px;text-align:center;font-weight:500;background:rgba(255,255,255,0.2);border-radius:20px;">📌 ${title} <br><span style="font-size:13px;opacity:0.7;">Windows 12 · modern desktop</span></div>`);
      }
    });

    document.getElementById('startButton').addEventListener('click', () => {
      alert('✨ Windows 12 Game Desktop · Double-click icons to play.');
    });

    // Snake game
    function openSnakeGame(appId, title) {
      const html = `
        <div class="game-container">
          <div class="score" id="snakeScore">Score: 0</div>
          <canvas id="snakeCanvas" width="280" height="280"></canvas>
          <div class="instructions">⬆⬇⬅➡ Arrow keys · Eat apple</div>
          <button class="retro" id="snakeRestart">New Game</button>
        </div>
      `;
      const winDiv = createWindow(appId, title, html);
      if (!winDiv) { focusWindow(appId); return; }
      setTimeout(() => initSnake(winDiv), 20);
    }

    function initSnake(winDiv) {
      const canvas = winDiv.querySelector('#snakeCanvas');
      const scoreSpan = winDiv.querySelector('#snakeScore');
      const restartBtn = winDiv.querySelector('#snakeRestart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const gridSize = 20;
      const tileCount = canvas.width / gridSize;
      let snake = [{x: 7, y: 7}];
      let direction = {x: 1, y: 0};
      let food = {x: 10, y: 9};
      let score = 0;
      let gameOver = false;
      let gameLoop = null;

      function randomFood() {
        let newFood;
        do {
          newFood = {
            x: Math.floor(Math.random() * tileCount),
            y: Math.floor(Math.random() * tileCount)
          };
        } while (snake.some(seg => seg.x === newFood.x && seg.y === newFood.y));
        return newFood;
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#2d5a27';
        snake.forEach(seg => ctx.fillRect(seg.x*gridSize, seg.y*gridSize, gridSize-2, gridSize-2));
        ctx.fillStyle = '#e63946';
        ctx.beginPath();
        ctx.arc(food.x*gridSize+gridSize/2, food.y*gridSize+gridSize/2, gridSize/2-1, 0, 2*Math.PI);
        ctx.fill();
        if (gameOver) {
          ctx.fillStyle = 'rgba(0,0,0,0.5)';
          ctx.fillRect(0,0,canvas.width,canvas.height);
          ctx.fillStyle = 'white';
          ctx.font = 'bold 20px "Segoe UI"';
          ctx.textAlign = 'center';
          ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
        }
        scoreSpan.textContent = `Score: ${score}`;
      }

      function step() {
        if (gameOver) return;
        const head = snake[0];
        const newHead = {x: head.x + direction.x, y: head.y + direction.y};
        if (newHead.x < 0 || newHead.x >= tileCount || newHead.y < 0 || newHead.y >= tileCount) {
          gameOver = true; draw(); return;
        }
        if (snake.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
          gameOver = true; draw(); return;
        }
        snake.unshift(newHead);
        if (newHead.x === food.x && newHead.y === food.y) {
          score++;
          food = randomFood();
        } else {
          snake.pop();
        }
        draw();
      }

      function resetGame() {
        if (gameLoop) clearInterval(gameLoop);
        snake = [{x: 7, y: 7}];
        direction = {x: 1, y: 0};
        score = 0;
        gameOver = false;
        food = randomFood();
        draw();
        if (window.snakeInterval) clearInterval(window.snakeInterval);
        gameLoop = setInterval(step, 130);
        window.snakeInterval = gameLoop;
      }

      window.addEventListener('keydown', (e) => {
        if (!openWindows.has('snake') || activeWindowId !== 'snake') return;
        e.preventDefault();
        if (e.key === 'ArrowUp' && direction.y === 0) direction = {x:0, y:-1};
        else if (e.key === 'ArrowDown' && direction.y === 0) direction = {x:0, y:1};
        else if (e.key === 'ArrowLeft' && direction.x === 0) direction = {x:-1, y:0};
        else if (e.key === 'ArrowRight' && direction.x === 0) direction = {x:1, y:0};
      });

      restartBtn.addEventListener('click', resetGame);
      if (window.snakeInterval) clearInterval(window.snakeInterval);
      gameLoop = setInterval(step, 130);
      window.snakeInterval = gameLoop;
      draw();
    }

    // Minesweeper

          <div id="mineGrid" style="display:grid; grid-template-columns:repeat(6,46px); gap:4px; margin:0 auto;"></div>
          <button class="retro" id="mineRestart">New Game</button>
        </div>
      `;
      const winDiv = createWindow(appId, title, html);
      if (!winDiv) { focusWindow(appId); return; }
      setTimeout(() => initMinesweeper(winDiv), 20);
    }

            board[r][c]=count;

      }
