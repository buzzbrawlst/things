<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Windows 11 · Modern Game Desktop</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI Variable', 'Segoe UI', 'SF Pro Display', system-ui, -apple-system, sans-serif;
    }

    body {
      background: #1a1a2e;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* modern desktop with acrylic background */
    .desktop {
      width: 100%;
      height: 100%;
      max-width: 1300px;
      max-height: 850px;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      position: relative;
      border-radius: 12px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      backdrop-filter: blur(20px);
    }

    /* icon grid */
    .icon-area {
      flex: 1;
      position: relative;
      padding: 30px 35px;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 24px 30px;
      z-index: 2;
    }

    .desktop-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90px;
      cursor: pointer;
      color: #ffffff;
      text-shadow: 0 2px 5px rgba(0,0,0,0.6);
      padding: 12px 6px 10px;
      border-radius: 12px;
      transition: all 0.18s ease;
      user-select: none;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.08);
    }

    .desktop-icon:hover {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.35);
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.4);
    }

    .desktop-icon:active {
      transform: scale(0.94);
      background: rgba(255,255,255,0.25);
    }

    .desktop-icon img {
      width: 52px;
      height: 52px;
      filter: drop-shadow(0 6px 8px rgba(0,0,0,0.5));
      margin-bottom: 6px;
      border-radius: 12px;
    }

    .desktop-icon span {
      font-size: 13px;
      font-weight: 500;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(8px);
      padding: 4px 10px;
      border-radius: 20px;
      text-align: center;
      word-break: break-word;
      max-width: 85px;
      letter-spacing: 0.3px;
    }

    /* Windows 11 style taskbar */
    .taskbar {
      background: rgba(20, 20, 30, 0.75);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      border-top: 1px solid rgba(255,255,255,0.15);
      height: 56px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      z-index: 30;
      border-radius: 0 0 12px 12px;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
    }

    .start-button {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 8px 18px;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      margin-right: 15px;
      color: white;
      transition: 0.2s;
      backdrop-filter: blur(10px);
      letter-spacing: 0.3px;
    }

    .start-button:hover {
      background: rgba(255,255,255,0.18);
      border-color: rgba(255,255,255,0.4);
    }

    .start-button img {
      width: 24px;
      height: 24px;
      filter: drop-shadow(0 2px 4px black);
    }

    .taskbar-windows {
      display: flex;
      gap: 10px;
      flex: 1;
      overflow-x: auto;
      height: 46px;
      align-items: center;
      padding: 0 5px;
    }

    .task-item {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      padding: 8px 18px;
      font-size: 14px;
      min-width: 140px;
      text-align: left;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f0f0f0;
      font-weight: 500;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .task-item.active {
      background: rgba(255,255,255,0.25);
      border-color: rgba(255,255,255,0.5);
      box-shadow: 0 0 15px rgba(100,150,255,0.5);
      font-weight: 600;
    }

    .task-item:hover {
      background: rgba(255,255,255,0.2);
    }

    .clock-area {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 8px 20px;
      color: white;
      font-size: 14px;
      font-weight: 600;
      margin-left: auto;
      backdrop-filter: blur(10px);
      letter-spacing: 0.5px;
    }

    /* Modern window (acrylic / mica) */
    .window {
      position: absolute;
      background: rgba(240, 245, 255, 0.8);
      backdrop-filter: blur(35px) saturate(200%);
      -webkit-backdrop-filter: blur(35px) saturate(200%);
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.2);
      min-width: 340px;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      z-index: 15;
      resize: both;
      overflow: auto;
      color: #111;
      transition: box-shadow 0.2s;
    }

    .window:focus-within {
      box-shadow: 0 25px 45px rgba(0,0,0,0.7), 0 0 0 2px rgba(180,200,255,0.6);
    }

    .window-title {
      background: rgba(255,255,255,0.4);
      backdrop-filter: blur(20px);
      color: #1e1e2e;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      font-weight: 600;
      font-size: 14px;
      cursor: move;
      user-select: none;
      border-radius: 14px 14px 0 0;
      border-bottom: 1px solid rgba(255,255,255,0.4);
    }

    .window-controls {
      display: flex;
      gap: 10px;
    }

    .win-btn {
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(8px);
      border: none;
      border-radius: 8px;
      width: 28px;
      height: 28px;
      font-weight: 600;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #2a2a3a;
      transition: 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    .win-btn:hover {
      background: rgba(255,255,255,0.9);
      color: #000;
    }

    .close-btn:hover {
      background: #e81123;
      color: white;
    }

    .window-content {
      flex: 1;
      padding: 18px;
      background: rgba(255,255,255,0.5);
      backdrop-filter: blur(15px);
      margin: 8px 12px 14px 12px;
      border-radius: 12px;
      overflow: auto;
      font-size: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border: 1px solid rgba(255,255,255,0.6);
      color: #0b0b15;
    }

    .hidden {
      display: none !important;
    }

    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      width: 100%;
    }

    canvas {
      border-radius: 14px;
      background: #f4f4f9;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
      width: 100%;
      height: auto;
      max-width: 300px;
      image-rendering: auto;
    }

    button.retro {
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.8);
      border-radius: 30px;
      padding: 10px 28px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: 0.2s;
      color: #111;
      box-shadow: 0 8px 18px rgba(0,0,0,0.2);
      letter-spacing: 0.5px;
    }

    button.retro:hover {
      background: white;
      border-color: white;
      box-shadow: 0 10px 22px rgba(0,0,0,0.3);
    }

    .score {
      font-weight: 700;
      font-size: 20px;
      background: rgba(255,255,255,0.5);
      backdrop-filter: blur(10px);
      padding: 6px 20px;
      border-radius: 30px;
      color: #0a0a20;
    }

    .instructions {
      background: rgba(255,255,240,0.7);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 500;
    }
  </style>
</head>
<body>
<div class="desktop" id="desktop">
  <div class="icon-area" id="iconArea">
    <div class="desktop-icon" data-app="snake" data-title="Snake Game">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23382b5f' rx='12'/%3E%3Ccircle cx='24' cy='22' r='5' fill='%23FFD93D'/%3E%3Ccircle cx='38' cy='22' r='5' fill='%23FFD93D'/%3E%3Cpath d='M12 44 L24 28 L36 38 L48 22 L56 34' stroke='%2344dd88' stroke-width='5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" alt="snake">
      <span>Snake.exe</span>
    </div>
    <div class="desktop-icon" data-app="minesweeper" data-title="Minesweeper">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%23282840' rx='12'/%3E%3Ccircle cx='32' cy='32' r='12' fill='%23CCCCDD'/%3E%3Cline x1='32' y1='18' x2='32' y2='46' stroke='%23FF5555' stroke-width='4' stroke-linecap='round'/%3E%3Cline x1='18' y1='32' x2='46' y2='32' stroke='%23FF5555' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" alt="minesweeper">
      <span>Mines.exe</span>
    </div>
  </div>

  <div class="taskbar">
    <div class="start-button" id="startButton">
      <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%234B7BFF' rx='8'/%3E%3Crect x='6' y='6' width='8' height='8' fill='white' rx='2'/%3E%3Crect x='18' y='6' width='8' height='8' fill='white' rx='2'/%3E%3Crect x='6' y='18' width='8' height='8' fill='white' rx='2'/%3E%3Crect x='18' y='18' width='8' height='8' fill='white' rx='2'/%3E%3C/svg%3E" alt="start">
      Start
    </div>
    <div class="taskbar-windows" id="taskbarWindows"></div>
    <div class="clock-area" id="clock">12:00 PM</div>
  </div>
</div>

<script>
  (function() {
    const desktop = document.getElementById('desktop');
    const taskbarWindows = document.getElementById('taskbarWindows');
    const iconArea = document.getElementById('iconArea');
    const clockEl = document.getElementById('clock');

    let openWindows = new Map();
    let activeWindowId = null;
    let zIndexCounter = 20;

    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = now.getMinutes().toString().padStart(2,'0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      clockEl.textContent = `${hours}:${minutes} ${ampm}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function createWindow(appId, title, contentHTML) {
      if (openWindows.has(appId)) {
        focusWindow(appId);
        return;
      }

      const winDiv = document.createElement('div');
      winDiv.className = 'window';
      winDiv.setAttribute('data-app', appId);
      winDiv.style.left = '100px';
      winDiv.style.top = '70px';
      winDiv.style.zIndex = ++zIndexCounter;
      
      const titleBar = document.createElement('div');
      titleBar.className = 'window-title';
      titleBar.innerHTML = `<span>${title}</span>
        <div class="window-controls">
          <div class="win-btn minimize-btn">─</div>
          <div class="win-btn close-btn">✕</div>
        </div>`;
      
      const contentDiv = document.createElement('div');
      contentDiv.className = 'window-content';
      contentDiv.innerHTML = contentHTML;

      winDiv.appendChild(titleBar);
      winDiv.appendChild(contentDiv);
      desktop.appendChild(winDiv);

      const taskItem = document.createElement('div');
      taskItem.className = 'task-item';
      taskItem.textContent = title;
      taskItem.setAttribute('data-app', appId);
      taskbarWindows.appendChild(taskItem);

      openWindows.set(appId, {
        windowEl: winDiv,
        taskItem: taskItem,
        title: title,
        appId: appId
      });

      winDiv.addEventListener('mousedown', (e) => {
        focusWindow(appId);
      });

      taskItem.addEventListener('click', () => {
        const winData = openWindows.get(appId);
        if (!winData) return;
        if (activeWindowId === appId && winData.windowEl.style.display !== 'none') {
          minimizeWindow(appId);
        } else {
          focusWindow(appId);
          if (winData.windowEl.style.display === 'none') {
            winData.windowEl.style.display = 'flex';
          }
        }
      });

      const closeBtn = titleBar.querySelector('.close-btn');
      closeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        closeWindow(appId);
      });

      const minimizeBtn = titleBar.querySelector('.minimize-btn');
      minimizeBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        minimizeWindow(appId);
      });

      titleBar.addEventListener('mousedown', (e) => {
        if (e.target.classList.contains('win-btn')) return;
        focusWindow(appId);
        const win = winDiv;
        const shiftX = e.clientX - win.getBoundingClientRect().left;
        const shiftY = e.clientY - win.getBoundingClientRect().top;

        function onMouseMove(e) {
          let newLeft = e.clientX - shiftX;
          let newTop = e.clientY - shiftY;
          const deskRect = desktop.getBoundingClientRect();
          if (newLeft < 0) newLeft = 0;
          if (newTop < 0) newTop = 0;
          if (newLeft + win.offsetWidth > deskRect.width) newLeft = deskRect.width - win.offsetWidth;
          if (newTop + win.offsetHeight > deskRect.height - 60) newTop = deskRect.height - win.offsetHeight - 60;
          win.style.left = newLeft + 'px';
          win.style.top = newTop + 'px';
        }

        function onMouseUp() {
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);
        }
        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });

      focusWindow(appId);
      return winDiv;
    }

    function focusWindow(appId) {
      const data = openWindows.get(appId);
      if (!data) return;
      data.windowEl.style.zIndex = ++zIndexCounter;
      if (activeWindowId && openWindows.has(activeWindowId)) {
        openWindows.get(activeWindowId).taskItem.classList.remove('active');
      }
      activeWindowId = appId;
      data.taskItem.classList.add('active');
      data.windowEl.style.display = 'flex';
    }

    function minimizeWindow(appId) {
      const data = openWindows.get(appId);
      if (!data) return;
      data.windowEl.style.display = 'none';
      data.taskItem.classList.remove('active');
      if (activeWindowId === appId) activeWindowId = null;
    }

    function closeWindow(appId) {
      const data = openWindows.get(appId);
      if (!data) return;
      data.windowEl.remove();
      data.taskItem.remove();
      openWindows.delete(appId);
      if (activeWindowId === appId) activeWindowId = null;
      if (appId === 'snake' && window.snakeInterval) {
        clearInterval(window.snakeInterval);
        window.snakeInterval = null;
      }
    }

    iconArea.addEventListener('dblclick', (e) => {
      const icon = e.target.closest('.desktop-icon');
      if (!icon) return;
      const app = icon.getAttribute('data-app');
      const title = icon.getAttribute('data-title') || app;
      if (app === 'snake') openSnakeGame(app, title);
      else if (app === 'minesweeper') openMinesweeper(app, title);
    });

    document.getElementById('startButton').addEventListener('click', () => {
      alert('✨ Windows 11 Game Desktop. Double-click icons to play.');
    });

    function openSnakeGame(appId, title) {
      const html = `
        <div class="game-container">
          <div class="score" id="snakeScore">Score: 0</div>
          <canvas id="snakeCanvas" width="260" height="260"></canvas>
          <div class="instructions">⬆⬇⬅➡ Arrow keys · Eat red apple</div>
          <button class="retro" id="snakeRestart">New Game</button>
        </div>
      `;
      const winDiv = createWindow(appId, title, html);
      if (!winDiv) { focusWindow(appId); return; }
      setTimeout(() => initSnake(winDiv), 20);
    }

    function initSnake(winDiv) {
      const canvas = winDiv.querySelector('#snakeCanvas');
      const scoreSpan = winDiv.querySelector('#snakeScore');
      const restartBtn = winDiv.querySelector('#snakeRestart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const gridSize = 20;
      const tileCount = canvas.width / gridSize;
      let snake = [{x: 7, y: 7}];
      let direction = {x: 1, y: 0};
      let food = {x: 10, y: 9};
      let score = 0;
      let gameOver = false;
      let gameLoop = null;

      function randomFood() {
        let newFood;
        do {
          newFood = {
            x: Math.floor(Math.random() * tileCount),
            y: Math.floor(Math.random() * tileCount)
          };
        } while (snake.some(seg => seg.x === newFood.x && seg.y === newFood.y));
        return newFood;
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#2d5a27';
        snake.forEach(seg => ctx.fillRect(seg.x*gridSize, seg.y*gridSize, gridSize-2, gridSize-2));
        ctx.fillStyle = '#e63946';
        ctx.beginPath();
        ctx.arc(food.x*gridSize+gridSize/2, food.y*gridSize+gridSize/2, gridSize/2-1, 0, 2*Math.PI);
        ctx.fill();
        if (gameOver) {
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(0,0,canvas.width,canvas.height);
          ctx.fillStyle = 'white';
          ctx.font = 'bold 18px "Segoe UI"';
          ctx.textAlign = 'center';
          ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2);
        }
        scoreSpan.textContent = `Score: ${score}`;
      }

      function step() {
        if (gameOver) return;
        const head = snake[0];
        const newHead = {x: head.x + direction.x, y: head.y + direction.y};
        if (newHead.x < 0 || newHead.x >= tileCount || newHead.y < 0 || newHead.y >= tileCount) {
          gameOver = true; draw(); return;
        }
        if (snake.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
          gameOver = true; draw(); return;
        }
        snake.unshift(newHead);
        if (newHead.x === food.x && newHead.y === food.y) {
          score++;
          food = randomFood();
        } else {
          snake.pop();
        }
        draw();
      }

      function resetGame() {
        if (gameLoop) clearInterval(gameLoop);
        snake = [{x: 7, y: 7}];
        direction = {x: 1, y: 0};
        score = 0;
        gameOver = false;
        food = randomFood();
        draw();
        if (window.snakeInterval) clearInterval(window.snakeInterval);
        gameLoop = setInterval(step, 130);
        window.snakeInterval = gameLoop;
      }

      window.addEventListener('keydown', (e) => {
        if (!openWindows.has('snake') || activeWindowId !== 'snake') return;
        e.preventDefault();
        if (e.key === 'ArrowUp' && direction.y === 0) direction = {x:0, y:-1};
        else if (e.key === 'ArrowDown' && direction.y === 0) direction = {x:0, y:1};
        else if (e.key === 'ArrowLeft' && direction.x === 0) direction = {x:-1, y:0};
        else if (e.key === 'ArrowRight' && direction.x === 0) direction = {x:1, y:0};
      });

      restartBtn.addEventListener('click', resetGame);
      if (window.snakeInterval) clearInterval(window.snakeInterval);
      gameLoop = setInterval(step, 130);
      window.snakeInterval = gameLoop;
      draw();
    }

    function openMinesweeper(appId, title) {
      const html = `
        <div class="game-container">
          <div class="score" id="mineStatus">💣 Mines: 5</div>
          <div id="mineGrid" style="display:grid; grid-template-columns:repeat(6,44px); gap:3px; margin:0 auto;"></div>
          <button class="retro" id="mineRestart">New Game</button>
        </div>
      `;
      const winDiv = createWindow(appId, title, html);
      if (!winDiv) { focusWindow(appId); return; }
      setTimeout(() => initMinesweeper(winDiv), 20);
    }

    function initMinesweeper(winDiv) {
      const gridEl = winDiv.querySelector('#mineGrid');
      const statusEl = winDiv.querySelector('#mineStatus');
      const restartBtn = winDiv.querySelector('#mineRestart');
      const rows = 6, cols = 6, mineCount = 5;
      let board = [], revealed = [], gameOver = false;

      function buildBoard() {
        board = Array(rows).fill().map(() => Array(cols).fill(0));
        revealed = Array(rows).fill().map(() => Array(cols).fill(false));
        let placed = 0;
        while (placed < mineCount) {
          const r = Math.floor(Math.random()*rows), c = Math.floor(Math.random()*cols);
          if (board[r][c] !== 'M') { board[r][c] = 'M'; placed++; }
        }
        for (let r=0; r<rows; r++) {
          for (let c=0; c<cols; c++) {
            if (board[r][c]==='M') continue;
            let count=0;
            for (let dr=-1; dr<=1; dr++) for (let dc=-1; dc<=1; dc++) {
              if (dr===0 && dc===0) continue;
              const nr=r+dr, nc=c+dc;
              if (nr>=0 && nr<rows && nc>=0 && nc<cols && board[nr][nc]==='M') count++;
            }
            board[r][c]=count;
          }
        }
      }

      function renderGrid() {
        gridEl.innerHTML = '';
        for (let r=0; r<rows; r++) {
          for (let c=0; c<cols; c++) {
            const cell = document.createElement('div');
            cell.style.width='44px'; cell.style.height='44px';
            cell.style.background='rgba(255,255,255,0.7)';
            cell.style.backdropFilter='blur(8px)';
            cell.style.borderRadius='10px';
            cell.style.display='flex'; cell.style.alignItems='center'; cell.style.justifyContent='center';
            cell.style.fontWeight='bold'; cell.style.cursor='pointer';
            if (revealed[r][c]) {
              cell.style.background='rgba(255,255,255,0.4)';
              if (board[r][c]==='M') cell.innerHTML='💣';
              else if (board[r][c]>0) cell.textContent=board[r][c];
            } else {
              cell.addEventListener('click', ()=> revealCell(r,c));
            }
            gridEl.appendChild(cell);
          }
        }
      }

      function revealCell(r,c) {
        if (gameOver || revealed[r][c]) return;
        revealed[r][c]=true;
        if (board[r][c]==='M') { gameOver=true; revealAll(); renderGrid(); statusEl.textContent='💥 Game Over'; return; }
        if (board[r][c]===0) {
          for (let dr=-1; dr<=1; dr++) for (let dc=-1; dc<=1; dc++) {
            const nr=r+dr, nc=c+dc;
            if (nr>=0 && nr<rows && nc>=0 && nc<cols && !revealed[nr][nc]) revealCell(nr,nc);
          }
        }
        renderGrid();
        let hiddenSafe=0;
        for (let rr=0; rr<rows; rr++) for (let cc=0; cc<cols; cc++) if (!revealed[rr][cc] && board[rr][cc]!=='M') hiddenSafe++;
        if (hiddenSafe===0 && !gameOver) { gameOver=true; statusEl.textContent='🎉 You Win!'; revealAll(); renderGrid(); }
      }

      function revealAll(){ for (let r=0;r<rows;r++) for (let c=0;c<cols;c++) revealed[r][c]=true; }
      function resetMines(){ gameOver=false; buildBoard(); renderGrid(); statusEl.textContent='💣 Mines: 5'; }
      restartBtn.addEventListener('click', resetMines);
      buildBoard(); renderGrid();
    }
  })();
</script>
</body>
</html>
