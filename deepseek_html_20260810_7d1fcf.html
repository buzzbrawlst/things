<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockVerse 3D - Create, Play, Share</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #threeCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* HUD Overlay */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
        }

        .hud-panel {
            background: rgba(22, 33, 62, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(233, 69, 96, 0.3);
            border-radius: 15px;
            padding: 15px 20px;
            pointer-events: auto;
        }

        .hud-left {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .hud-center {
            text-align: center;
        }

        .hud-right {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-end;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 16px;
            font-weight: bold;
        }

        .health-bar {
            width: 200px;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            transition: width 0.3s;
            border-radius: 4px;
        }

        .xp-bar {
            width: 200px;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }

        .xp-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffd700, #ffed4a);
            transition: width 0.3s;
            border-radius: 4px;
        }

        .game-title {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .score-display {
            font-size: 32px;
            font-weight: bold;
            color: #ffd700;
        }

        /* Controls Help */
        #controlsHelp {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(22, 33, 62, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(233, 69, 96, 0.3);
            border-radius: 15px;
            padding: 15px 25px;
            pointer-events: auto;
            z-index: 10;
            display: flex;
            gap: 25px;
            font-size: 14px;
        }

        .control-key {
            background: rgba(233, 69, 96, 0.2);
            border: 1px solid rgba(233, 69, 96, 0.5);
            border-radius: 5px;
            padding: 4px 8px;
            font-weight: bold;
            color: #e94560;
        }

        /* Chat */
        #chatBox {
            position: absolute;
            bottom: 100px;
            left: 20px;
            width: 300px;
            background: rgba(22, 33, 62, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(233, 69, 96, 0.3);
            border-radius: 15px;
            pointer-events: auto;
            z-index: 10;
            display: none;
        }

        .chat-messages {
            height: 150px;
            overflow-y: auto;
            padding: 15px;
        }

        .chat-input {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border: none;
            border-top: 1px solid rgba(233, 69, 96, 0.3);
            color: white;
            border-radius: 0 0 15px 15px;
            outline: none;
        }

        .chat-message {
            margin-bottom: 8px;
            font-size: 14px;
        }

        .chat-username {
            color: #e94560;
            font-weight: bold;
        }

        /* Minimap */
        #minimap {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            background: rgba(22, 33, 62, 0.9);
            border: 2px solid rgba(233, 69, 96, 0.3);
            border-radius: 50%;
            pointer-events: auto;
            z-index: 10;
            overflow: hidden;
        }

        /* Inventory */
        #inventory {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 5px;
            pointer-events: auto;
            z-index: 10;
            display: none;
        }

        .inventory-slot {
            width: 50px;
            height: 50px;
            background: rgba(22, 33, 62, 0.9);
            border: 2px solid rgba(233, 69, 96, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .inventory-slot:hover, .inventory-slot.active {
            border-color: #e94560;
            background: rgba(233, 69, 96, 0.2);
        }

        /* Loading Screen */
        #loadingScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.5s;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(233, 69, 96, 0.2);
            border-top: 4px solid #e94560;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 20px;
            font-size: 18px;
            color: #a0a0b0;
        }

        /* Pause Menu */
        #pauseMenu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(22, 33, 62, 0.95);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(233, 69, 96, 0.5);
            border-radius: 20px;
            padding: 30px;
            pointer-events: auto;
            z-index: 50;
            display: none;
            text-align: center;
            min-width: 300px;
        }

        .menu-button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(233, 69, 96, 0.2);
            border: 1px solid rgba(233, 69, 96, 0.5);
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .menu-button:hover {
            background: rgba(233, 69, 96, 0.4);
            transform: scale(1.05);
        }

        .menu-button.primary {
            background: #e94560;
            border: none;
        }

        .menu-button.primary:hover {
            background: #ff6b6b;
        }

        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 5;
        }

        .crosshair-line {
            position: absolute;
            background: rgba(255, 255, 255, 0.8);
        }

        .crosshair-h {
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            transform: translateY(-50%);
        }

        .crosshair-v {
            left: 50%;
            top: 0;
            width: 2px;
            height: 100%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="threeCanvas"></canvas>
        
        <!-- Loading Screen -->
        <div id="loadingScreen">
            <div class="loading-spinner"></div>
            <div class="loading-text">Loading BlockVerse 3D...</div>
        </div>

        <!-- HUD -->
        <div id="hud">
            <div class="hud-left">
                <div class="hud-panel">
                    <div class="stat-item">
                        <span>❤️</span>
                        <div class="health-bar">
                            <div class="health-fill" id="healthFill" style="width: 100%"></div>
                        </div>
                        <span id="healthText">100</span>
                    </div>
                    <div class="stat-item">
                        <span>⭐</span>
                        <div class="xp-bar">
                            <div class="xp-fill" id="xpFill" style="width: 45%"></div>
                        </div>
                        <span id="xpText">Lvl 5</span>
                    </div>
                </div>
            </div>
            
            <div class="hud-center">
                <div class="hud-panel">
                    <div class="game-title">BlockVerse 3D</div>
                    <div class="score-display" id="scoreDisplay">0</div>
                    <div style="font-size: 12px; color: #a0a0b0;">Coins Collected</div>
                </div>
            </div>
            
            <div class="hud-right">
                <div class="hud-panel">
                    <div class="stat-item">
                        <span>👥</span>
                        <span id="playerCount">1</span>
                    </div>
                    <div class="stat-item">
                        <span>💎</span>
                        <span id="currencyDisplay">1,250</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Controls Help -->
        <div id="controlsHelp">
            <div><span class="control-key">WASD</span> Move</div>
            <div><span class="control-key">Space</span> Jump</div>
            <div><span class="control-key">Shift</span> Sprint</div>
            <div><span class="control-key">E</span> Interact</div>
            <div><span class="control-key">ESC</span> Menu</div>
            <div><span class="control-key">T</span> Chat</div>
        </div>

        <!-- Chat Box -->
        <div id="chatBox">
            <div class="chat-messages" id="chatMessages"></div>
            <input type="text" class="chat-input" id="chatInput" placeholder="Press Enter to send...">
        </div>

        <!-- Minimap -->
        <div id="minimap">
            <canvas id="minimapCanvas" width="150" height="150"></canvas>
        </div>

        <!-- Inventory -->
        <div id="inventory">
            <div class="inventory-slot active">⚔️</div>
            <div class="inventory-slot">🛡️</div>
            <div class="inventory-slot">🧪</div>
            <div class="inventory-slot">📦</div>
            <div class="inventory-slot">🎒</div>
        </div>

        <!-- Crosshair -->
        <div id="crosshair">
            <div class="crosshair-line crosshair-h"></div>
            <div class="crosshair-line crosshair-v"></div>
        </div>

        <!-- Pause Menu -->
        <div id="pauseMenu">
            <h2 style="margin-bottom: 20px; color: #e94560;">Game Paused</h2>
            <button class="menu-button primary" onclick="resumeGame()">▶ Resume</button>
            <button class="menu-button" onclick="openSettings()">⚙️ Settings</button>
            <button class="menu-button" onclick="switchGame()">🎮 Switch Game</button>
            <button class="menu-button" onclick="quitGame()">🚪 Leave Game</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // ==================== GAME ENGINE ====================
        
        // Scene Setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x1a1a2e, 50, 200);
        scene.background = new THREE.Color(0x87CEEB);

        // Camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 25);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ 
            canvas: document.getElementById('threeCanvas'),
            antialias: true 
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
        sunLight.position.set(50, 100, 50);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 500;
        sunLight.shadow.camera.left = -100;
        sunLight.shadow.camera.right = 100;
        sunLight.shadow.camera.top = 100;
        sunLight.shadow.camera.bottom = -100;
        scene.add(sunLight);

        // ==================== TERRAIN ====================
        
        function createGround() {
            const groundGeometry = new THREE.PlaneGeometry(200, 200);
            const groundMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x4a7c59,
                roughness: 0.8,
                metalness: 0.2
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -0.5;
            ground.receiveShadow = true;
            scene.add(ground);

            // Add grid pattern
            const gridHelper = new THREE.GridHelper(200, 40, 0x5a8c69, 0x4a7c59);
            gridHelper.position.y = -0.4;
            scene.add(gridHelper);
        }

        function createTrees() {
            for (let i = 0; i < 30; i++) {
                const tree = new THREE.Group();
                
                // Trunk
                const trunkGeometry = new THREE.CylinderGeometry(0.3, 0.4, 4, 8);
                const trunkMaterial = new THREE.MeshStandardMaterial({ color: 0x8B4513 });
                const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
                trunk.position.y = 2;
                trunk.castShadow = true;
                tree.add(trunk);

                // Leaves
                for (let j = 0; j < 3; j++) {
                    const leavesGeometry = new THREE.SphereGeometry(1.2 - j * 0.2, 8, 8);
                    const leavesMaterial = new THREE.MeshStandardMaterial({ 
                        color: new THREE.Color().setHSL(0.25 + Math.random() * 0.1, 0.7, 0.3 + Math.random() * 0.2)
                    });
                    const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
                    leaves.position.y = 3.5 + j * 1.2;
                    leaves.position.x = (Math.random() - 0.5) * 0.5;
                    leaves.position.z = (Math.random() - 0.5) * 0.5;
                    leaves.castShadow = true;
                    tree.add(leaves);
                }

                tree.position.x = (Math.random() - 0.5) * 150;
                tree.position.z = (Math.random() - 0.5) * 150;
                tree.position.y = 0;
                scene.add(tree);
            }
        }

        function createBuildings() {
            const buildings = [
                { x: -30, z: -20, w: 8, h: 10, d: 8, color: 0x8B7355 },
                { x: 20, z: -15, w: 6, h: 8, d: 6, color: 0x9B8B75 },
                { x: -15, z: 25, w: 10, h: 12, d: 8, color: 0x7B6345 },
                { x: 30, z: 20, w: 7, h: 9, d: 7, color: 0xA09375 },
                { x: -40, z: -30, w: 12, h: 15, d: 10, color: 0x6B5335 },
            ];

            buildings.forEach(building => {
                const group = new THREE.Group();
                
                // Main building
                const buildingGeometry = new THREE.BoxGeometry(building.w, building.h, building.d);
                const buildingMaterial = new THREE.MeshStandardMaterial({ 
                    color: building.color,
                    roughness: 0.7
                });
                const buildingMesh = new THREE.Mesh(buildingGeometry, buildingMaterial);
                buildingMesh.position.y = building.h / 2;
                buildingMesh.castShadow = true;
                buildingMesh.receiveShadow = true;
                group.add(buildingMesh);

                // Roof
                const roofGeometry = new THREE.ConeGeometry(building.w * 0.8, 3, 4);
                const roofMaterial = new THREE.MeshStandardMaterial({ color: 0x8B0000 });
                const roof = new THREE.Mesh(roofGeometry, roofMaterial);
                roof.position.y = building.h + 1.5;
                roof.castShadow = true;
                group.add(roof);

                // Windows
                for (let y = 1; y < building.h - 1; y += 2) {
                    for (let x = -1; x <= 1; x++) {
                        const windowGeometry = new THREE.PlaneGeometry(1, 1.5);
                        const windowMaterial = new THREE.MeshStandardMaterial({ 
                            color: 0xFFD700,
                            emissive: 0x332200,
                            emissiveIntensity: 0.3
                        });
                        const window = new THREE.Mesh(windowGeometry, windowMaterial);
                        window.position.set(x * 2, y, building.d / 2 + 0.01);
                        group.add(window);
                    }
                }

                group.position.set(building.x, 0, building.z);
                scene.add(group);
            });
        }

        function createCollectibles() {
            const coins = [];
            for (let i = 0; i < 50; i++) {
                const coinGeometry = new THREE.CylinderGeometry(0.5, 0.5, 0.1, 16);
                const coinMaterial = new THREE.MeshStandardMaterial({ 
                    color: 0xFFD700,
                    metalness: 0.8,
                    roughness: 0.2,
                    emissive: 0x332200,
                    emissiveIntensity: 0.3
                });
                const coin = new THREE.Mesh(coinGeometry, coinMaterial);
                coin.position.set(
                    (Math.random() - 0.5) * 100,
                    1,
                    (Math.random() - 0.5) * 100
                );
                coin.rotation.x = Math.PI / 2;
                coin.castShadow = true;
                coin.userData = { collected: false, type: 'coin', value: 10 };
                scene.add(coin);
                coins.push(coin);
            }
            return coins;
        }

        function createPowerUps() {
            const powerUps = [];
            const types = ['health', 'speed', 'shield'];
            
            for (let i = 0; i < 10; i++) {
                const type = types[Math.floor(Math.random() * types.length)];
                const geometry = new THREE.OctahedronGeometry(0.8);
                const material = new THREE.MeshStandardMaterial({ 
                    color: type === 'health' ? 0xff0000 : type === 'speed' ? 0x00ff00 : 0x0000ff,
                    emissive: type === 'health' ? 0x440000 : type === 'speed' ? 0x004400 : 0x000044,
                    emissiveIntensity: 0.5,
                    metalness: 0.5,
                    roughness: 0.2
                });
                const powerUp = new THREE.Mesh(geometry, material);
                powerUp.position.set(
                    (Math.random() - 0.5) * 80,
                    2,
                    (Math.random() - 0.5) * 80
                );
                powerUp.castShadow = true;
                powerUp.userData = { collected: false, type: type };
                scene.add(powerUp);
                powerUps.push(powerUp);
            }
            return powerUps;
        }

        // ==================== CHARACTER CREATION ====================
        
        function createHumanoidCharacter(color = 0xf0c8a0, isPlayer = false) {
            const character = new THREE.Group();
            
            // Body proportions
            const bodyHeight = 2.5;
            const bodyWidth = 1.0;
            
            // Torso
            const torsoGeometry = new THREE.BoxGeometry(bodyWidth, bodyHeight * 0.5, bodyWidth * 0.6);
            const torsoMaterial = new THREE.MeshStandardMaterial({ 
                color: isPlayer ? 0x4169E1 : 0x8B0000,
                roughness: 0.6
            });
            const torso = new THREE.Mesh(torsoGeometry, torsoMaterial);
            torso.position.y = bodyHeight * 0.75;
            torso.castShadow = true;
            character.add(torso);
            
            // Head
            const headGeometry = new THREE.SphereGeometry(0.4, 16, 16);
            const headMaterial = new THREE.MeshStandardMaterial({ 
                color: color,
                roughness: 0.4
            });
            const head = new THREE.Mesh(headGeometry, headMaterial);
            head.position.y = bodyHeight + 0.1;
            head.castShadow = true;
            character.add(head);
            
            // Eyes
            const eyeGeometry = new THREE.SphereGeometry(0.08);
            const eyeMaterial = new THREE.MeshStandardMaterial({ color: 0x000000 });
            
            const leftEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            leftEye.position.set(-0.15, bodyHeight + 0.15, 0.35);
            character.add(leftEye);
            
            const rightEye = new THREE.Mesh(eyeGeometry, eyeMaterial);
            rightEye.position.set(0.15, bodyHeight + 0.15, 0.35);
            character.add(rightEye);
            
            // Mouth
            const mouthGeometry = new THREE.BoxGeometry(0.15, 0.05, 0.05);
            const mouthMaterial = new THREE.MeshStandardMaterial({ color: 0x8B0000 });
            const mouth = new THREE.Mesh(mouthGeometry, mouthMaterial);
            mouth.position.set(0, bodyHeight - 0.02, 0.35);
            character.add(mouth);
            
            // Hair
            const hairGeometry = new THREE.SphereGeometry(0.42, 16, 16, 0, Math.PI * 2, 0, Math.PI / 2);
            const hairMaterial = new THREE.MeshStandardMaterial({ color: 0x4a3728 });
            const hair = new THREE.Mesh(hairGeometry, hairMaterial);
            hair.position.y = bodyHeight + 0.15;
            character.add(hair);
            
            // Arms
            const armGeometry = new THREE.CylinderGeometry(0.15, 0.15, bodyHeight * 0.4, 8);
            const armMaterial = new THREE.MeshStandardMaterial({ 
                color: color,
                roughness: 0.4
            });
            
            // Left arm
            const leftArm = new THREE.Mesh(armGeometry, armMaterial);
            leftArm.position.set(-bodyWidth * 0.5 - 0.15, bodyHeight * 0.85, 0);
            leftArm.rotation.z = 0.2;
            leftArm.castShadow = true;
            character.add(leftArm);
            
            // Right arm
            const rightArm = new THREE.Mesh(armGeometry, armMaterial);
            rightArm.position.set(bodyWidth * 0.5 + 0.15, bodyHeight * 0.85, 0);
            rightArm.rotation.z = -0.2;
            rightArm.castShadow = true;
            character.add(rightArm);
            
            // Hands
            const handGeometry = new THREE.SphereGeometry(0.15);
            const leftHand = new THREE.Mesh(handGeometry, armMaterial);
            leftHand.position.set(-bodyWidth * 0.5 - 0.15, bodyHeight * 0.65, 0);
            character.add(leftHand);
            
            const rightHand = new THREE.Mesh(handGeometry, armMaterial);
            rightHand.position.set(bodyWidth * 0.5 + 0.15, bodyHeight * 0.65, 0);
            character.add(rightHand);
            
            // Legs
            const legGeometry = new THREE.CylinderGeometry(0.18, 0.18, bodyHeight * 0.4, 8);
            const legMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x2F4F4F,
                roughness: 0.5
            });
            
            // Left leg
            const leftLeg = new THREE.Mesh(legGeometry, legMaterial);
            leftLeg.position.set(-0.2, bodyHeight * 0.2, 0);
            leftLeg.castShadow = true;
            character.add(leftLeg);
            
            // Right leg
            const rightLeg = new THREE.Mesh(legGeometry, legMaterial);
            rightLeg.position.set(0.2, bodyHeight * 0.2, 0);
            rightLeg.castShadow = true;
            character.add(rightLeg);
            
            // Shoes
            const shoeGeometry = new THREE.BoxGeometry(0.25, 0.1, 0.35);
            const shoeMaterial = new THREE.MeshStandardMaterial({ color: 0x1a1a1a });
            
            const leftShoe = new THREE.Mesh(shoeGeometry, shoeMaterial);
            leftShoe.position.set(-0.2, 0.05, 0.05);
            character.add(leftShoe);
            
            const rightShoe = new THREE.Mesh(shoeGeometry, shoeMaterial);
            rightShoe.position.set(0.2, 0.05, 0.05);
            character.add(rightShoe);
            
            // Name tag (only for player)
            if (isPlayer) {
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('You', 128, 40);
                
                const texture = new THREE.CanvasTexture(canvas);
                const nameplateMaterial = new THREE.SpriteMaterial({ map: texture });
                const nameplate = new THREE.Sprite(nameplateMaterial);
                nameplate.position.y = bodyHeight + 0.8;
                nameplate.scale.set(2, 0.5, 1);
                character.add(nameplate);
            }
            
            return character;
        }

        // ==================== PLAYER SYSTEM ====================
        
        const player = {
            mesh: null,
            velocity: new THREE.Vector3(),
            speed: 8,
            sprintSpeed: 12,
            jumpForce: 12,
            health: 100,
            maxHealth: 100,
            xp: 450,
            level: 5,
            coins: 0,
            isGrounded: false,
            isSprinting: false,
            canJump: true,
            inventory: ['sword', 'shield', 'potion'],
            selectedSlot: 0,
            animationTime: 0
        };

        function createPlayer() {
            player.mesh = createHumanoidCharacter(0xf0c8a0, true);
            player.mesh.position.set(0, 0, 0);
            scene.add(player.mesh);
            
            // Add weapon
            const swordGeometry = new THREE.BoxGeometry(0.1, 1.2, 0.05);
            const swordMaterial = new THREE.MeshStandardMaterial({ color: 0xC0C0C0, metalness: 0.8 });
            const sword = new THREE.Mesh(swordGeometry, swordMaterial);
            sword.position.set(0.7, 1.5, 0);
            sword.rotation.z = -0.5;
            player.mesh.add(sword);
            player.sword = sword;
        }

        // ==================== NPC SYSTEM ====================
        
        const npcs = [];
        const npcNames = ['Alex', 'Sam', 'Jordan', 'Casey', 'Riley', 'Morgan', 'Taylor', 'Quinn'];
        
        function createNPCs() {
            for (let i = 0; i < 5; i++) {
                const npc = createHumanoidCharacter(
                    new THREE.Color().setHSL(Math.random(), 0.3, 0.5 + Math.random() * 0.3).getHex()
                );
                npc.position.set(
                    (Math.random() - 0.5) * 60,
                    0,
                    (Math.random() - 0.5) * 60
                );
                
                // Name tag
                const canvas = document.createElement('canvas');
                canvas.width = 256;
                canvas.height = 64;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                const name = npcNames[i];
                ctx.fillText(name, 128, 40);
                
                const texture = new THREE.CanvasTexture(canvas);
                const nameplateMaterial = new THREE.SpriteMaterial({ map: texture });
                const nameplate = new THREE.Sprite(nameplateMaterial);
                nameplate.position.y = 3.5;
                nameplate.scale.set(2, 0.5, 1);
                npc.add(nameplate);
                
                scene.add(npc);
                
                npcs.push({
                    mesh: npc,
                    name: name,
                    velocity: new THREE.Vector3(),
                    targetX: npc.position.x,
                    targetZ: npc.position.z,
                    walkTimer: Math.random() * 5,
                    animationTime: Math.random() * 100
                });
            }
        }

        function updateNPCs(delta) {
            npcs.forEach(npc => {
                npc.walkTimer -= delta;
                
                if (npc.walkTimer <= 0) {
                    npc.targetX = npc.mesh.position.x + (Math.random() - 0.5) * 20;
                    npc.targetZ = npc.mesh.position.z + (Math.random() - 0.5) * 20;
                    npc.walkTimer = 3 + Math.random() * 5;
                }
                
                const dx = npc.targetX - npc.mesh.position.x;
                const dz = npc.targetZ - npc.mesh.position.z;
                const distance = Math.sqrt(dx * dx + dz * dz);
                
                if (distance > 0.5) {
                    npc.mesh.position.x += (dx / distance) * 3 * delta;
                    npc.mesh.position.z += (dz / distance) * 3 * delta;
                    npc.mesh.rotation.y = Math.atan2(dx, dz);
                }
                
                // Simple idle animation
                npc.animationTime += delta * 5;
                npc.mesh.children.forEach(child => {
                    if (child.geometry && child.geometry.type === 'CylinderGeometry') {
                        if (child.position.y < 1) {
                            child.rotation.x = Math.sin(npc.animationTime) * 0.1;
                        }
                    }
                });
            });
        }

        // ==================== PHYSICS & COLLISIONS ====================
        
        const gravity = -20;
        const groundLevel = 0;
        const obstacles = [];

        function checkCollisions() {
            // Ground collision
            if (player.mesh.position.y <= groundLevel) {
                player.mesh.position.y = groundLevel;
                player.velocity.y = 0;
                player.isGrounded = true;
                player.canJump = true;
            } else {
                player.isGrounded = false;
            }
            
            // World bounds
            const worldSize = 90;
            player.mesh.position.x = Math.max(-worldSize, Math.min(worldSize, player.mesh.position.x));
            player.mesh.position.z = Math.max(-worldSize, Math.min(worldSize, player.mesh.position.z));
            
            // Building collisions (simple AABB)
            const playerPos = player.mesh.position;
            const playerRadius = 0.5;
            
            const buildings = [
                { x: -30, z: -20, w: 8, d: 8 },
                { x: 20, z: -15, w: 6, d: 6 },
                { x: -15, z: 25, w: 10, d: 8 },
                { x: 30, z: 20, w: 7, d: 7 },
                { x: -40, z: -30, w: 12, d: 10 },
            ];
            
            buildings.forEach(building => {
                const halfW = building.w / 2 + playerRadius;
                const halfD = building.d / 2 + playerRadius;
                
                if (Math.abs(playerPos.x - building.x) < halfW &&
                    Math.abs(playerPos.z - building.z) < halfD) {
                    // Push player out
                    const overlapX = halfW - Math.abs(playerPos.x - building.x);
                    const overlapZ = halfD - Math.abs(playerPos.z - building.z);
                    
                    if (overlapX < overlapZ) {
                        player.mesh.position.x += (playerPos.x > building.x ? 1 : -1) * overlapX;
                    } else {
                        player.mesh.position.z += (playerPos.z > building.z ? 1 : -1) * overlapZ;
                    }
                }
            });
        }

        function checkCollectibleCollisions(coins, powerUps) {
            const playerPos = player.mesh.position;
            
            coins.forEach(coin => {
                if (!coin.userData.collected) {
                    const distance = playerPos.distanceTo(coin.position);
                    if (distance < 2) {
                        coin.userData.collected = true;
                        coin.visible = false;
                        player.coins += coin.userData.value;
                        updateHUD();
                        
                        // Spawn particle effect
                        spawnParticles(coin.position, 0xFFD700);
                    }
                }
            });
            
            powerUps.forEach(powerUp => {
                if (!powerUp.userData.collected) {
                    const distance = playerPos.distanceTo(powerUp.position);
                    if (distance < 2) {
                        powerUp.userData.collected = true;
                        powerUp.visible = false;
                        applyPowerUp(powerUp.userData.type);
                        spawnParticles(powerUp.position, powerUp.material.color.getHex());
                    }
                }
            });
        }

        function applyPowerUp(type) {
            switch(type) {
                case 'health':
                    player.health = Math.min(player.maxHealth, player.health + 30);
                    addChatMessage('System', '❤️ Health restored!');
                    break;
                case 'speed':
                    player.speed *= 1.5;
                    setTimeout(() => { player.speed = 8; }, 5000);
                    addChatMessage('System', '⚡ Speed boost activated!');
                    break;
                case 'shield':
                    addChatMessage('System', '🛡️ Shield activated!');
                    break;
            }
        }

        function spawnParticles(position, color) {
            for (let i = 0; i < 10; i++) {
                const geometry = new THREE.SphereGeometry(0.1);
                const material = new THREE.MeshBasicMaterial({ color: color });
                const particle = new THREE.Mesh(geometry, material);
                particle.position.copy(position);
                particle.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 5,
                    Math.random() * 5,
                    (Math.random() - 0.5) * 5
                );
                particle.life = 1;
                scene.add(particle);
                
                // Animate and remove
                const animate = () => {
                    particle.position.add(particle.velocity.clone().multiplyScalar(0.016));
                    particle.velocity.y -= 10 * 0.016;
                    particle.life -= 0.016;
                    particle.material.opacity = particle.life;
                    
                    if (particle.life > 0) {
                        requestAnimationFrame(animate);
                    } else {
                        scene.remove(particle);
                    }
                };
                animate();
            }
        }

        // ==================== INPUT SYSTEM ====================
        
        const keys = {};
        let mouseLocked = false;
        let mouseSensitivity = 0.002;
        let euler = new THREE.Euler(0, 0, 0, 'YXZ');
        let isPaused = false;

        document.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            
            if (e.key === 'Escape') {
                togglePause();
            }
            
            if (e.key === 't' && !isPaused) {
                toggleChat();
            }
            
            if (e.key === 'e' && !isPaused) {
                interact();
            }
            
            if (e.key >= '1' && e.key <= '5') {
                player.selectedSlot = parseInt(e.key) - 1;
                updateInventoryUI();
            }
        });

        document.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        document.addEventListener('mousemove', (e) => {
            if (mouseLocked && !isPaused) {
                euler.setFromQuaternion(camera.quaternion);
                euler.y -= e.movementX * mouseSensitivity;
                euler.x -= e.movementY * mouseSensitivity;
                euler.x = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, euler.x));
                camera.quaternion.setFromEuler(euler);
            }
        });

        document.getElementById('threeCanvas').addEventListener('click', () => {
            if (!isPaused) {
                document.getElementById('threeCanvas').requestPointerLock();
                mouseLocked = true;
            }
        });

        document.addEventListener('pointerlockchange', () => {
            mouseLocked = document.pointerLockElement === document.getElementById('threeCanvas');
        });

        function handleInput(delta) {
            if (isPaused) return;
            
            const direction = new THREE.Vector3();
            const forward = new THREE.Vector3();
            const right = new THREE.Vector3();
            
            camera.getWorldDirection(forward);
            forward.y = 0;
            forward.normalize();
            
            right.crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();
            
            if (keys['w'] || keys['arrowup']) direction.add(forward);
            if (keys['s'] || keys['arrowdown']) direction.sub(forward);
            if (keys['a'] || keys['arrowleft']) direction.sub(right);
            if (keys['d'] || keys['arrowright']) direction.add(right);
            
            direction.normalize();
            
            player.isSprinting = keys['shift'];
            const currentSpeed = player.isSprinting ? player.sprintSpeed : player.speed;
            
            player.mesh.position.x += direction.x * currentSpeed * delta;
            player.mesh.position.z += direction.z * currentSpeed * delta;
            
            // Rotate player to face movement direction
            if (direction.length() > 0) {
                const angle = Math.atan2(direction.x, direction.z);
                player.mesh.rotation.y = angle;
            }
            
            // Jumping
            if ((keys[' '] || keys['space']) && player.isGrounded && player.canJump) {
                player.velocity.y = player.jumpForce;
                player.canJump = false;
            }
        }

        function updatePlayerAnimation(delta) {
            if (player.isGrounded && (keys['w'] || keys['s'] || keys['a'] || keys['d'])) {
                player.animationTime += delta * (player.isSprinting ? 15 : 10);
            } else {
                player.animationTime += delta * 2;
            }
            
            // Animate limbs
            player.mesh.children.forEach((child, index) => {
                if (child.geometry) {
                    if (child.geometry.type === 'CylinderGeometry') {
                        if (child.position.y < 1 && child.position.y > 0.5) {
                            // Arms
                            child.rotation.x = Math.sin(player.animationTime) * 0.5;
                        } else if (child.position.y < 0.5 && child.position.y > 0) {
                            // Legs
                            child.rotation.x = Math.sin(player.animationTime + Math.PI) * 0.5;
                        }
                    }
                }
            });
            
            // Sword swing animation
            if (player.sword && keys['f']) {
                player.sword.rotation.z = Math.sin(player.animationTime * 10) * 1.5 - 0.5;
            } else if (player.sword) {
                player.sword.rotation.z = -0.5;
            }
        }

        // ==================== CAMERA SYSTEM ====================
        
        function updateCamera() {
            const cameraOffset = new THREE.Vector3(0, 3, 8);
            
            // Third-person camera with collision avoidance
            const desiredPosition = player.mesh.position.clone().add(cameraOffset);
            
            // Smooth camera follow
            camera.position.lerp(desiredPosition, 0.1);
            
            // Look at player
            const lookTarget = player.mesh.position.clone();
            lookTarget.y += 2;
            camera.lookAt(lookTarget);
        }

        // ==================== UI SYSTEM ====================
        
        function updateHUD() {
            document.getElementById('healthFill').style.width = (player.health / player.maxHealth * 100) + '%';
            document.getElementById('healthText').textContent = player.health;
            document.getElementById('scoreDisplay').textContent = player.coins;
            document.getElementById('playerCount').textContent = npcs.length + 1;
        }

        function updateInventoryUI() {
            const slots = document.querySelectorAll('.inventory-slot');
            slots.forEach((slot, index) => {
                slot.classList.toggle('active', index === player.selectedSlot);
            });
        }

        function updateMinimap() {
            const canvas = document.getElementById('minimapCanvas');
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
            ctx.fillRect(0, 0, 150, 150);
            
            const scale = 1.5;
            const centerX = 75;
            const centerY = 75;
            
            // Draw player
            ctx.fillStyle = '#00ff00';
            ctx.beginPath();
            ctx.arc(centerX, centerY, 4, 0, Math.PI * 2);
            ctx.fill();
            
            // Draw NPCs
            ctx.fillStyle = '#ff0000';
            npcs.forEach(npc => {
                const dx = (npc.mesh.position.x - player.mesh.position.x) * scale;
                const dz = (npc.mesh.position.z - player.mesh.position.z) * scale;
                ctx.beginPath();
                ctx.arc(centerX + dx, centerY + dz, 3, 0, Math.PI * 2);
                ctx.fill();
            });
            
            // Draw buildings
            ctx.fillStyle = '#8B7355';
            const buildings = [
                { x: -30, z: -20 }, { x: 20, z: -15 }, { x: -15, z: 25 },
                { x: 30, z: 20 }, { x: -40, z: -30 }
            ];
            buildings.forEach(building => {
                const dx = (building.x - player.mesh.position.x) * scale;
                const dz = (building.z - player.mesh.position.z) * scale;
                ctx.fillRect(centerX + dx - 2, centerY + dz - 2, 4, 4);
            });
        }

        function togglePause() {
            isPaused = !isPaused;
            document.getElementById('pauseMenu').style.display = isPaused ? 'block' : 'none';
            if (isPaused) {
                document.exitPointerLock();
            }
        }

        function resumeGame() {
            isPaused = false;
            document.getElementById('pauseMenu').style.display = 'none';
            document.getElementById('threeCanvas').requestPointerLock();
        }

        function toggleChat() {
            const chatBox = document.getElementById('chatBox');
            chatBox.style.display = chatBox.style.display === 'block' ? 'none' : 'block';
            if (chatBox.style.display === 'block') {
                document.getElementById('chatInput').focus();
                document.exitPointerLock();
            }
        }

        function addChatMessage(username, message) {
            const chatMessages = document.getElementById('chatMessages');
            const messageElement = document.createElement('div');
            messageElement.className = 'chat-message';
            messageElement.innerHTML = `<span class="chat-username">${username}:</span> ${message}`;
            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        document.getElementById('chatInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                const input = document.getElementById('chatInput');
                const message = input.value.trim();
                if (message) {
                    addChatMessage('You', message);
                    input.value = '';
                    
                    // NPC responses
                    setTimeout(() => {
                        const responses = [
                            'Hello!', 'Nice day!', 'Check out the buildings!',
                            'Have you found any power-ups?', 'This game is fun!'
                        ];
                        const randomNPC = npcs[Math.floor(Math.random() * npcs.length)];
                        addChatMessage(randomNPC.name, responses[Math.floor(Math.random() * responses.length)]);
                    }, 1000);
                }
            }
        });

        function interact() {
            // Check if near any NPC
            npcs.forEach(npc => {
                const distance = player.mesh.position.distanceTo(npc.mesh.position);
                if (distance < 5) {
                    addChatMessage(npc.name, 'Hey there! How are you?');
                }
            });
        }

        function switchGame() {
            alert('Switching to another game... This would connect to a different game server.');
            resumeGame();
        }

        function quitGame() {
            if (confirm('Are you sure you want to leave the game?')) {
                alert('Returning to BlockVerse hub...');
                location.reload();
            }
        }

        function openSettings() {
            alert('Settings panel would open here with graphics, audio, and control options.');
        }

        // ==================== GAME LOOP ====================
        
        let coins = [];
        let powerUps = [];
        let lastTime = performance.now();
        let gameTime = 0;

        function init() {
            createGround();
            createTrees();
            createBuildings();
            coins = createCollectibles();
            powerUps = createPowerUps();
            createPlayer();
            createNPCs();
            
            // Initial camera position
            camera.position.set(0, 10, 20);
            camera.lookAt(0, 2, 0);
            
            // Hide loading screen
            setTimeout(() => {
                document.getElementById('loadingScreen').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('loadingScreen').style.display = 'none';
                }, 500);
            }, 1500);
            
            updateHUD();
        }

        function gameLoop(currentTime) {
            requestAnimationFrame(gameLoop);
            
            const delta = Math.min((currentTime - lastTime) / 1000, 0.1);
            lastTime = currentTime;
            
            if (!isPaused) {
                gameTime += delta;
                
                // Update player physics
                player.velocity.y += gravity * delta;
                player.mesh.position.y += player.velocity.y * delta;
                
                handleInput(delta);
                checkCollisions();
                checkCollectibleCollisions(coins, powerUps);
                updatePlayerAnimation(delta);
                updateNPCs(delta);
                updateCamera();
                updateMinimap();
                
                // Rotate coins and power-ups
                coins.forEach(coin => {
                    if (!coin.userData.collected) {
                        coin.rotation.z += delta * 2;
                    }
                });
                
                powerUps.forEach(powerUp => {
                    if (!powerUp.userData.collected) {
                        powerUp.rotation.y += delta * 3;
                        powerUp.position.y = 2 + Math.sin(gameTime * 2) * 0.5;
                    }
                });
                
                // Sun movement for dynamic lighting
                const sunAngle = gameTime * 0.1;
                sunLight.position.x = Math.cos(sunAngle) * 50;
                sunLight.position.z = Math.sin(sunAngle) * 50;
                
                // Day/night cycle
                const dayProgress = (Math.sin(sunAngle) + 1) / 2;
                scene.fog.color.setHSL(0.6, 0.5, 0.3 + dayProgress * 0.4);
                ambientLight.intensity = 0.3 + dayProgress * 0.3;
                
                // Update HUD periodically
                if (Math.floor(gameTime) !== Math.floor(gameTime - delta)) {
                    updateHUD();
                }
            }
            
            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Initialize and start
        init();
        requestAnimationFrame(gameLoop);

        // Auto-hide controls help after 10 seconds
        setTimeout(() => {
            document.getElementById('controlsHelp').style.opacity = '0.5';
        }, 10000);

        console.log('🎮 BlockVerse 3D Initialized!');
        console.log('Controls: WASD to move, Space to jump, Shift to sprint, E to interact');
        console.log('Click to lock mouse, ESC to pause, T to chat');
        console.log('Collect coins and power-ups, interact with NPCs!');
    </script>
</body>
</html>
