<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Classroom Game</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--text:#17202a;--muted:#697586;--green:#20b86a;--green2:#159957;--line:#e5e9ee;--shadow:0 8px 28px rgba(18,28,38,.10)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}a{text-decoration:none;color:inherit}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 max(18px,calc((100% - 1180px)/2));gap:22px;position:sticky;top:0;z-index:20}.brand{font-weight:900;font-size:20px;display:flex;align-items:center;gap:9px}.brandmark{width:34px;height:34px;border-radius:9px;background:var(--green);display:grid;place-items:center;color:white;font-weight:900}.back{margin-left:auto;color:#5e6977;font-size:14px;font-weight:700}.wrap{width:min(1180px,calc(100% - 24px));margin:20px auto 60px}.player{background:#111;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);position:relative}.screen{aspect-ratio:16/9;width:100%;border:0;display:block;background:#111}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#111;color:white;font-weight:700;z-index:2}.spinner{width:34px;height:34px;border:4px solid #ffffff2e;border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin:auto auto 10px}.loadbox{text-align:center}.hidden{opacity:0;pointer-events:none;transition:.25s}.bar{background:#fff;padding:11px 14px;display:flex;align-items:center;gap:8px;border-top:1px solid #222}.bar button,.action{border:0;border-radius:8px;padding:9px 13px;font-weight:800;cursor:pointer}.play{background:var(--green);color:white}.dark{background:#eef1f4;color:#25313d}.bar .status{margin-left:auto;font-size:12px;color:#74808c}.hero{display:flex;gap:16px;align-items:center;margin:22px 0}.logo{width:82px;height:82px;border-radius:16px;object-fit:cover;background:#ddd;box-shadow:0 5px 18px #0001}.title{margin:0;font-size:32px;line-height:1.05}.sub{color:var(--muted);margin-top:7px;font-size:14px}.actions{margin-left:auto;display:flex;gap:8px}.action{font-size:13px}.primary{background:var(--green);color:#fff}.favorite.active{background:#ffe8ef;color:#e54872}.tags{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 22px}.tag{background:#e8f8ef;color:#13814a;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 4px 16px #00000008}.card h2{font-size:16px;margin:0 0 13px}.desc{font-size:14px;color:#596574;line-height:1.7;white-space:pre-line}.stats{display:grid;gap:12px}.stat{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:11px;font-size:13px}.stat:last-child{border:0;padding-bottom:0}.label{color:#7a8592}.value{font-weight:800}.shots{display:flex;gap:12px;overflow-x:auto;padding-bottom:5px}.shot{width:230px;height:130px;flex:0 0 auto;object-fit:cover;border-radius:10px;cursor:pointer;transition:.18s}.shot:hover{transform:translateY(-3px)}.controls{display:grid;gap:8px}.control{display:flex;justify-content:space-between;gap:15px;background:#f5f7f9;border-radius:9px;padding:10px 12px;font-size:13px}.key{font-weight:900}.recommend{margin-top:18px}.recgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.rec{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:.18s;cursor:pointer}.rec:hover{transform:translateY(-3px);box-shadow:var(--shadow)}.rec img{width:100%;aspect-ratio:1.5;object-fit:cover;background:#ddd}.rec div{padding:10px;font-weight:800;font-size:13px}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:100;padding:20px}.modal.show{display:grid}.modal img{max-width:95vw;max-height:90vh;border-radius:12px}.close{position:fixed;top:20px;right:20px;background:#fff;border:0;border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:760px){.top{padding:0 12px}.wrap{width:calc(100% - 14px);margin-top:10px}.hero{align-items:flex-start}.logo{width:64px;height:64px}.title{font-size:25px}.actions{margin-left:0}.hero{flex-wrap:wrap}.actions{width:100%}.actions .action{flex:1}.grid{grid-template-columns:1fr}.recgrid{grid-template-columns:repeat(2,1fr)}.back{font-size:12px}}
</style>
</head>
<body>
<header class="top"><a class="brand" href="#"><span class="brandmark">C</span>CLASSROOM</a><a class="back" id="back" href="#">← Back to Games</a></header>
<main class="wrap">
<section class="player">
<div class="loading" id="loading"><div class="loadbox"><div class="spinner"></div>Loading game...</div></div>
<iframe id="frame" class="screen" allowfullscreen></iframe>
<div class="bar"><button class="play" onclick="loadGame()">▶ Reload Game</button><button class="dark" onclick="fullscreenGame()">⛶ Fullscreen</button><button class="dark" onclick="scrollInfo()">ℹ Info</button><span class="status" id="status">Ready</span></div>
</section>
<section class="hero" id="info">
<img class="logo" id="logo" alt="Game logo"><div><h1 class="title" id="name"></h1><div class="sub" id="short"></div></div><div class="actions"><button class="action primary" onclick="loadGame()">▶ Play</button><button class="action dark favorite" id="fav" onclick="favorite()">♡ Favorite</button></div>
</section>
<div class="tags" id="tags"></div>
<section class="grid">
<div>
<div class="card"><h2>About this game</h2><div class="desc" id="description"></div></div>
<div class="card" style="margin-top:18px"><h2>Screenshots</h2><div class="shots" id="shots"></div></div>
<div class="card" style="margin-top:18px"><h2>Controls</h2><div class="controls" id="controls"></div></div>
</div>
<aside><div class="card"><h2>Game Info</h2><div class="stats"><div class="stat"><span class="label">Genre</span><span class="value" id="genre"></span></div><div class="stat"><span class="label">Players</span><span class="value" id="players"></span></div><div class="stat"><span class="label">Rating</span><span class="value" id="rating"></span></div><div class="stat"><span class="label">Version</span><span class="value" id="version"></span></div><div class="stat"><span class="label">Updated</span><span class="value" id="updated"></span></div><div class="stat"><span class="label">Developer</span><span class="value" id="developer"></span></div></div></div></aside>
</section>
<section class="recommend"><div class="card"><h2>More Games</h2><div class="recgrid" id="recommended"></div></div></section>
</main>
<div class="modal" id="modal" onclick="closeModal(event)"><button class="close">×</button><img id="modalImg"></div>
<script>
/* ==========================================================
   EDIT ONLY THIS OBJECT FOR EACH GAME
========================================================== */
const GAME={
 name:"Drive Mad",
 short:"Drive through crazy physics levels and try not to flip.",
 html:"https://raw.githubusercontent.com/YOURNAME/YOURREPO/main/game.html",
 logo:"https://placehold.co/256x256/20b86a/ffffff?text=GAME",
 description:"Drive through insane physics levels, dodge obstacles and make it to the finish.\n\nThis description can contain multiple paragraphs and you never need to edit the HTML below.",
 genre:"Driving",
 players:"1 Player",
 rating:"9.7/10",
 version:"1.0.0",
 updated:"September 2026",
 developer:"Classroom Games",
 tags:["Driving","Physics","Arcade","Popular"],
 screenshots:[
  "https://placehold.co/600x340/202b31/ffffff?text=Screenshot+1",
  "https://placehold.co/600x340/263b31/ffffff?text=Screenshot+2",
  "https://placehold.co/600x340/312b3b/ffffff?text=Screenshot+3"
 ],
 controls:[
  ["WASD / Arrow Keys","Drive"],
  ["Space","Jump"],
  ["R","Restart Level"]
 ],
 back:"https://sites.google.com/jhgs.bucks.sch.uk/classroom/to-do-classroom?authuser=3",
 recommended:[
  {name:"Game One",image:"https://placehold.co/500x300/20b86a/fff?text=GAME+ONE",url:"#"},
  {name:"Game Two",image:"https://placehold.co/500x300/7357ff/fff?text=GAME+TWO",url:"#"},
  {name:"Game Three",image:"https://placehold.co/500x300/f04b62/fff?text=GAME+THREE",url:"#"},
  {name:"Game Four",image:"https://placehold.co/500x300/f0a83d/fff?text=GAME+FOUR",url:"#"}
 ]
};

function $(id){return document.getElementById(id)}
function setup(){
 document.title="Classroom — "+GAME.name;
 $('name').textContent=GAME.name;$('short').textContent=GAME.short;$('logo').src=GAME.logo;$('description').textContent=GAME.description;
 $('genre').textContent=GAME.genre;$('players').textContent=GAME.players;$('rating').textContent=GAME.rating;$('version').textContent=GAME.version;$('updated').textContent=GAME.updated;$('developer').textContent=GAME.developer;$('back').href=GAME.back;
 $('tags').innerHTML=GAME.tags.map(x=>`<span class="tag">${escapeHTML(x)}</span>`).join('');
 $('shots').innerHTML=GAME.screenshots.map((x,i)=>`<img class="shot" src="${x}" alt="Screenshot ${i+1}" onclick="openShot('${x.replaceAll("'","\\'")}')">`).join('');
 $('controls').innerHTML=GAME.controls.map(x=>`<div class="control"><span class="key">${escapeHTML(x[0])}</span><span>${escapeHTML(x[1])}</span></div>`).join('');
 $('recommended').innerHTML=GAME.recommended.map(x=>`<div class="rec" onclick="location.href='${x.url}'"><img src="${x.image}" alt=""><div>${escapeHTML(x.name)}</div></div>`).join('');
 const key='classroom-favorite-'+GAME.name; if(localStorage.getItem(key)==='1'){$('fav').textContent='♥ Favorited';$('fav').classList.add('active')}
 loadGame();
}
function escapeHTML(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function getHTML(){const r=await fetch(GAME.html,{cache:'no-cache'});if(!r.ok)throw new Error('GitHub returned '+r.status);return await r.text()}
async function loadGame(){
 $('loading').classList.remove('hidden');$('status').textContent='Loading...';
 try{const html=await getHTML();const doc=$('frame').contentDocument||$('frame').contentWindow.document;doc.open();doc.write(html);doc.close();setTimeout(()=>{$('loading').classList.add('hidden');$('status').textContent='Game running'},450)}catch(e){console.error(e);$('status').textContent='Failed to load';$('loading').innerHTML='<div class="loadbox">⚠<br><br>Could not load the game.<br><small>Check the GitHub RAW HTML URL.</small></div>'}
}
async function fullscreenGame(){try{const html=await getHTML();const w=window.open('about:blank','_blank');if(!w){alert('Popup blocked. Allow popups for Classroom.');return}w.document.open();w.document.write(html);w.document.close();w.focus()}catch(e){alert('Could not open the game. Check the GitHub HTML URL.')}}
function favorite(){const key='classroom-favorite-'+GAME.name;const active=localStorage.getItem(key)==='1';if(active){localStorage.removeItem(key);$('fav').textContent='♡ Favorite';$('fav').classList.remove('active')}else{localStorage.setItem(key,'1');$('fav').textContent='♥ Favorited';$('fav').classList.add('active')}}
function scrollInfo(){$('info').scrollIntoView({behavior:'smooth'})}
function openShot(src){$('modalImg').src=src;$('modal').classList.add('show')}
function closeModal(e){if(e.target.id==='modal'||e.target.classList.contains('close'))$('modal').classList.remove('show')}
setup();
</script>
</body>
</html>
